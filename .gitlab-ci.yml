variables:
  NODE_VERSION: "22.14.0"
  NODE_LINUX_X64_SHA256: "69b09dba5c8dcb05c4e4273a4340db1005abeafe3927efda2bc5b249e80437ec"

stages:
  - test
  - review

# Shared rules: run on merge requests and on the default branch.
.default_rules: &default_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Shared setup: install a pinned Node, enable pnpm via corepack, install deps.
#
# The store lives inside the project directory because GitLab can only cache paths under it. With
# the cache warm, `pnpm install` is a link step against already-downloaded tarballs rather than a
# fetch of the whole dependency graph.
.node_before_script: &node_before_script
  - curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o "/tmp/node-v${NODE_VERSION}-linux-x64.tar.xz"
  - echo "${NODE_LINUX_X64_SHA256}  /tmp/node-v${NODE_VERSION}-linux-x64.tar.xz" | sha256sum -c -
  - tar -xJf "/tmp/node-v${NODE_VERSION}-linux-x64.tar.xz" -C /tmp
  - export PATH="/tmp/node-v${NODE_VERSION}-linux-x64/bin:$PATH"
  - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.cfdata.org/".insteadOf "git@gitlab.cfdata.org:"
  - corepack enable
  - git submodule update --init
  - pnpm install --frozen-lockfile --store-dir .pnpm-store

# ---------------------------------------------------------------------------
# Lint, build and test (blocking)
# ---------------------------------------------------------------------------
# One job on purpose. Split across `lint` and `test` the two shared nothing: each paid for its own
# Node download and install, and the type check ran twice -- once as `lint`'s `types:check`, once
# as `test`'s `build`, which after dropping the dead declaration emit are the same command.
check:
  stage: test
  tags:
    - vm-linux-x86-4cpu-8gb
  rules: *default_rules
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script: *node_before_script
  script:
    # oxlint. `pnpm lint` is this plus `build`, kept as separate steps here so a failure names
    # which one broke.
    - pnpm lint:check
    # Codegen, type check and the frontend/SPA bundles.
    - pnpm build
    - pnpm test

include:
  # ---------------------------------------------------------------------------
  # AI code review (MR only)
  # ---------------------------------------------------------------------------
  - component: $CI_SERVER_FQDN/cloudflare/ci/ai/opencode@~latest
    inputs:
      stage: review
      runOnMR: true
      ASSIGN_REVIEWERS: false
