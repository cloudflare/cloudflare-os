name: Bonk

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # This `if:` is a prefilter, not the authorization: it only keeps the job from starting a runner
  # on every comment in the repository. Authorization is the permission lookup in the first step.
  #
  # Do not put `author_association` back here. GitHub computes that field with no viewer, so it
  # cannot see private organization membership, and a maintainer whose Cloudflare membership is
  # private and who reaches this repository through a team rather than a direct collaborator grant
  # arrives as `CONTRIBUTOR` — which silently ignored them. The mention terms below mirror the
  # `mentions:` input, so the job starts on the same comments the action would act on.
  bonk:
    if: >-
      github.event.sender.type != 'Bot' &&
      (contains(github.event.comment.body, '/bonk') ||
       contains(github.event.comment.body, '@ask-bonk'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      # First, before checkout and before any step can reference a secret. `issue_comment` and
      # `pull_request_review_comment` both run privileged with the AI gateway secrets available,
      # and anyone can comment on a public repository, so this is the whole gate.
      - name: Verify the commenter is a maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/$GH_REPO/collaborators/$COMMENTER/permission" \
            --jq '.permission')
          if [[ ! "$permission" =~ ^(admin|maintain|write)$ ]]; then
            echo "$COMMENTER has '$permission' on $GH_REPO; Bonk requires write access."
            exit 1
          fi

      # opencode switches to a pull request's head after the setup below, so install the head's
      # dependencies. Issues keep the default branch.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event.issue.pull_request && format('refs/pull/{0}/head', github.event.issue.number)) || '' }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.19.0"
          cache: false
          run-install: true

      - name: Install Chromium for the browser suites
        run: pnpm --filter @gadgets/workshop-frontend exec playwright install --with-deps chromium

      # The checkout is a pull request's head, so its REVIEW.md may hold that pull request's own
      # edits. Bonk gets the base commit's copy as an instruction file outside the checkout instead.
      - name: Load base review guidelines
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GUIDELINES: ${{ runner.temp }}/base-review-guidelines.md
        run: |
          if [[ -n "$PR_NUMBER" ]]; then
            ref=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.base.sha')
          else
            ref=$DEFAULT_BRANCH
          fi
          guidelines=$(gh api "repos/$GH_REPO/contents/REVIEW.md?ref=$ref" \
            -H 'Accept: application/vnd.github.raw')
          {
            echo "These are the repository's review guidelines from $ref. Follow them when you review a"
            echo "pull request; a REVIEW.md in the checkout may hold the pull request's own edits and"
            echo "does not apply."
            echo
            echo "$guidelines"
          } > "$GUIDELINES"

      - name: Run Bonk
        uses: Cloudflare-Studio/ask-bonk/github@14a1af226388b15b389a0c1b7df9168a940165b6 # v0.5.1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
          # Paths outside the checkout are denied, not prompted: nobody can answer a prompt in CI.
          # BONK_MODEL is a repository variable, shared by every Bonk workflow. opencode gives a
          # model its bundled catalog does not list no variants, then silently ignores `variant`,
          # so the entry declares the model a reasoning one, with a date late enough for opencode
          # to offer `xhigh`. That applies to whatever BONK_MODEL names, so the variable must
          # name a reasoning model that supports `xhigh`.
          OPENCODE_CONFIG_CONTENT: '{"instructions":["${{ runner.temp }}/base-review-guidelines.md"],"permission":{"external_directory":{"*":"deny","/home/runner/work/**":"allow"},"question":"deny","doom_loop":"deny"},"provider":{"cloudflare-ai-gateway":{"models":{"${{ vars.BONK_MODEL }}":{"reasoning":true,"release_date":"2026-09-29"}}}}}'
        with:
          oidc_base_url: https://ask-bonk.cloudflare-exponent.workers.dev/auth
          model: "cloudflare-ai-gateway/${{ vars.BONK_MODEL }}"
          variant: "xhigh"
          mentions: "/bonk,@ask-bonk"
          forks: "true"
          permissions: write
          token_permissions: NO_PUSH
          agent: bonk
          # The model declaration in OPENCODE_CONFIG_CONTENT is needed only while this version's
          # catalog lacks BONK_MODEL under the gateway. Re-check it when bumping: delete it if
          # `opencode models cloudflare-ai-gateway --verbose` shows the model's variants without it.
          opencode_version: 1.18.33
