name: Risk review trigger

# Relays pull request, review, review-comment and merge group events to risk-review.yml, which
# decides again from the default branch through `workflow_run`. These events run the pull request's
# (or the merge group's) own copy of this file, so it holds no permissions and does nothing, and a
# pull request can change or delete it; a merge group whose relay never runs never gets its required
# check, so it cannot merge.
# A pull request that breaks it leaves its check stale until a producer run or a maintainer comment
# wakes the gate, and a revoked approval or a new review hold may not refresh it at all. The merge
# group backstops that: the gate decides every queued pull request again, from current reviews,
# comments and base policy, before it merges.
on:
  pull_request:
    branches: [main]
    # `edited` covers a new base, `assigned` and `unassigned` the director of an agent's pull request.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited, assigned, unassigned]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, deleted]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Hand off to Risk review
        run: echo "risk-review.yml decides this pull request again."
