name: Automerge head proofs

# Producers that build or run the pull request's code. Each job writes one `automerge-<name>`
# artifact (scripts/automerge/proofs/artifact.ts) for the risk-review gate, which binds it to this
# file, the `pull_request` event, the head SHA and the newest attempt.
#
# No job here holds a secret or posts a check. Head code runs in every job, so any job could upload
# an artifact under any name in this run; that is why the proof that judges untrusted dependency
# code runs in automerge-proofs.yml, where nothing from the head executes. What this run produces
# rests on the author being a maintainer (threat model, rule 7). The scripts are the judge commit's,
# but the head's code and dependencies run beside them, and a compromised dependency could write a
# false `preview-smoke`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"

jobs:
  # A test-only pull request's tests kill at least the mutants the base tests killed. The proof
  # stops itself at AUTOMERGE_MUTATION_BUDGET_MINUTES with status `error`; the job timeout leaves
  # room for setup and the upload after it.
  tests:
    name: Test-only mutation proof
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      AUTOMERGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTOMERGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      AUTOMERGE_MUTATION_BUDGET_MINUTES: "20"
    steps:
      # The judge is the base branch's, as this run merges the head onto it: the first parent of the
      # merge commit this workflow file comes from (README.md, "Risk review").
      # `pull_request.base.sha` can be far older, and the head may not hold these scripts at all.
      # Fetched into a repository of its own, so the head's full clone stays full.
      - name: Copy the judge
        id: judge
        run: |
          git init -q --bare "$RUNNER_TEMP/judge.git"
          git -C "$RUNNER_TEMP/judge.git" fetch -q --no-tags --depth=2 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          judge=$(git -C "$RUNNER_TEMP/judge.git" rev-parse "$GITHUB_SHA^1")
          git -C "$RUNNER_TEMP/judge.git" archive --output="$RUNNER_TEMP/judge.tar" "$judge" scripts/automerge 'scripts/risk-review*'
          mkdir "$RUNNER_TEMP/judge"
          tar -xf "$RUNNER_TEMP/judge.tar" -C "$RUNNER_TEMP/judge"
          echo "sha=$judge" >> "$GITHUB_OUTPUT"

      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: true

      - name: proof-tests
        run: node "$RUNNER_TEMP/judge/scripts/automerge/proofs/tests.ts"

      - name: Upload proof-tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automerge-proof-tests
          path: automerge-out/automerge-proof-tests.json
          if-no-files-found: error

  # The pull request's workers, built and run on the runner in workerd (scripts/run-local.ts), answer
  # on `/` and `/api/version`. Nothing is deployed and no secret is held, so it runs for every pull
  # request, Dependabot's included.
  preview-smoke:
    name: Local preview smoke
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AUTOMERGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTOMERGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      # The judge, as in the job above.
      - name: Copy the judge
        id: judge
        run: |
          git init -q --bare "$RUNNER_TEMP/judge.git"
          git -C "$RUNNER_TEMP/judge.git" fetch -q --no-tags --depth=2 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          judge=$(git -C "$RUNNER_TEMP/judge.git" rev-parse "$GITHUB_SHA^1")
          git -C "$RUNNER_TEMP/judge.git" archive --output="$RUNNER_TEMP/judge.tar" "$judge" scripts/automerge 'scripts/risk-review*'
          mkdir "$RUNNER_TEMP/judge"
          tar -xf "$RUNNER_TEMP/judge.tar" -C "$RUNNER_TEMP/judge"
          echo "sha=$judge" >> "$GITHUB_OUTPUT"

      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Vite+, Node.js and dependencies
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: true

      - name: preview-smoke
        run: node "$RUNNER_TEMP/judge/scripts/automerge/proofs/smoke.ts" local

      - name: Upload preview-smoke
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automerge-preview-smoke
          path: automerge-out/automerge-preview-smoke.json
          if-no-files-found: error
