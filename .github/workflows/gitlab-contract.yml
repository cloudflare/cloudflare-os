# Checks against GitLab itself what the GitLab gatekeeper's hooks rely on GitLab for, which the
# fakes in the regular suites can only assume: see packages/gatekeeper-gitlab/__tests__/contract.
#
# It needs a disposable private project, with at least one commit, on GitLab 19.0 or later,
# named by its path in the CONTRACT_GITLAB_PROJECT variable, and the CONTRACT_GITLAB_TOKEN secret,
# without which it does nothing: a token that can reach that project alone, as a Maintainer -- the
# project's own access token with the Maintainer role and the `api` scope, or one of an account kept
# for the purpose -- never one of an account that can reach more, let alone an administrator's. Only
# the step running the checks is handed it, not those installing what they run. The instance is
# gitlab.com unless the CONTRACT_GITLAB_URL variable names another, over https. Each run leaves
# closed issues and merge requests behind.
name: GitLab contract

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Runs share the one project.
concurrency:
  group: gitlab-contract
  cancel-in-progress: false

env:
  NODE_VERSION: "24.19.0"

jobs:
  contract:
    name: GitLab contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Says whether there is one without handing every step the token, as `if:` can't read secrets.
      - name: Look for a contract project
        id: contract
        env:
          CONTRACT_GITLAB_TOKEN: ${{ secrets.CONTRACT_GITLAB_TOKEN }}
          CONTRACT_GITLAB_PROJECT: ${{ vars.CONTRACT_GITLAB_PROJECT }}
        run: |
          if [ -n "$CONTRACT_GITLAB_TOKEN" ] && [ -n "$CONTRACT_GITLAB_PROJECT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CONTRACT_GITLAB_TOKEN or CONTRACT_GITLAB_PROJECT is not set, so the GitLab contract checks were skipped."
          fi

      - name: Check out repository
        if: steps.contract.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        if: steps.contract.outputs.configured == 'true'
        run: corepack enable

      - name: Set up Vite+, Node.js and dependencies
        if: steps.contract.outputs.configured == 'true'
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: true

      - name: Check GitLab's contract
        if: steps.contract.outputs.configured == 'true'
        run: pnpm --filter @gadgets/gitlab-gatekeeper test:contract
        env:
          CONTRACT_GITLAB_TOKEN: ${{ secrets.CONTRACT_GITLAB_TOKEN }}
          CONTRACT_GITLAB_PROJECT: ${{ vars.CONTRACT_GITLAB_PROJECT }}
          CONTRACT_GITLAB_URL: ${{ vars.CONTRACT_GITLAB_URL }}
