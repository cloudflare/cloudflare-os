name: Review verdict

# The Opus review of each non-draft head, parsed into the `automerge-verdict-opus.json` artifact the
# risk-review gate reads. The other verdict is Bonk's, from bonk-pr.yml. This workflow publishes
# nothing itself: no check run, no comment, and no write permission. From the fourth reviewed head
# on it runs no model and its verdict sends the pull request to a person. The reviewer reads a copy
# of the head built from git objects with every instruction file taken from the judge commit, and
# the gateway secrets reach only the step that runs opencode.
#
# Nothing from the head's working tree configures or runs anything here: the checkout, the
# toolchain setup and the scripts are the judge commit's, and the head is fetched only as git
# objects for the review copy and the patch. This file is the merge commit's on `pull_request`, and
# the head can change it, so verdict trust still rests on the gate, which gives no AI decision to a
# pull request that touches `.github/**` or `scripts/automerge/**`. Fork pull requests never get here.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # A newer head makes this review stale; a cancelled run counts as no review of its head.
  cancel-in-progress: true

jobs:
  verdict:
    name: Verdict (opus)
    # Fork pull requests get no gateway secrets, and the gate ignores their artifacts; bot pull
    # requests get Dependabot's secrets only.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Lists this workflow's earlier runs and jobs to count review rounds.
      actions: read
      contents: read
    steps:
      # The judge is the base branch's, as this run merges the head onto it: the first parent of the
      # merge commit this workflow file comes from (README.md, "Risk review").
      # `pull_request.base.sha` can be far older. Fetched into a repository of its own.
      - name: Copy the judge
        id: judge
        run: |
          git init -q --bare "$RUNNER_TEMP/judge.git"
          git -C "$RUNNER_TEMP/judge.git" fetch -q --no-tags --depth=2 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          judge=$(git -C "$RUNNER_TEMP/judge.git" rev-parse "$GITHUB_SHA^1")
          git -C "$RUNNER_TEMP/judge.git" archive --output="$RUNNER_TEMP/judge.tar" "$judge" scripts/automerge 'scripts/risk-review*'
          mkdir "$RUNNER_TEMP/judge"
          tar -xf "$RUNNER_TEMP/judge.tar" -C "$RUNNER_TEMP/judge"
          echo "sha=$judge" >> "$GITHUB_OUTPUT"

      # Full history for the merge base and earlier reviewed heads.
      - name: Check out the judge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.judge.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the head commit's objects
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags origin "$HEAD_SHA"

      - name: Set up Node.js
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.19.0"
          run-install: false

      - name: Prepare the review
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_DIR: ${{ github.workspace }}
          JOB_NAME: Verdict (opus)
          AUTOMERGE_JUDGE_SHA: ${{ steps.judge.outputs.sha }}
        run: node "$RUNNER_TEMP/judge/scripts/automerge/verdict/verdict.ts" prepare

      # The platform binary straight from the registry, checked against a pinned sha256 so the
      # reviewer cannot change under the same version. Bump the version and hash together, and
      # check `opencode models cloudflare-ai-gateway --verbose` still lists the model's variants.
      - name: Install opencode
        if: steps.prepare.outputs.review == 'true'
        env:
          OPENCODE_TARBALL: https://registry.npmjs.org/opencode-linux-x64/-/opencode-linux-x64-1.19.6.tgz
          OPENCODE_SHA256: 378f7ba827c63e61390e35b9b26336c56b202bfe71a531cd10b488da771321ff
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/opencode.tgz" "$OPENCODE_TARBALL"
          echo "$OPENCODE_SHA256  $RUNNER_TEMP/opencode.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opencode"
          tar -xzf "$RUNNER_TEMP/opencode.tgz" -C "$RUNNER_TEMP/opencode" --strip-components=1

      - name: Review
        if: steps.prepare.outputs.review == 'true'
        continue-on-error: true
        timeout-minutes: 45
        env:
          OPENCODE_BIN: ${{ runner.temp }}/opencode/bin/opencode
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_GATEWAY_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CF_AI_GATEWAY_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_GATEWAY_TOKEN }}
        run: node "$RUNNER_TEMP/judge/scripts/automerge/verdict/verdict.ts" review

      - name: Write the verdict
        if: ${{ !cancelled() }}
        run: node "$RUNNER_TEMP/judge/scripts/automerge/verdict/verdict.ts" finalize

      - name: Upload the verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automerge-verdict-opus
          path: ${{ runner.temp }}/automerge-verdict-opus.json
          if-no-files-found: error
          overwrite: true
