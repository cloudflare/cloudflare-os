name: Automerge weekly sample

# Once a week, files one issue sampling the pull requests the risk-review gate merged without a
# person through a rung 3 area (scripts/automerge/evidence/weekly-sample.ts). Inert while rung 3
# is closed: the script reads .github/automerge-bands.json from the default branch and exits when
# it is missing or opens no rung 3 band in enforce mode. A schedule runs the default branch, so no
# pull request code runs here.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: automerge-weekly-sample
  cancel-in-progress: false

jobs:
  sample:
    name: Sample rung 3 merges
    if: github.repository_owner == 'cloudflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: read
      issues: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.19.0"
          cache: false
          run-install: false

      - name: File the sample
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RISK_REVIEW_APP_ID: ${{ vars.RISK_REVIEW_APP_ID }}
          SAMPLE_ASSIGNEE: kentonv
        run: node scripts/automerge/evidence/weekly-sample.ts
