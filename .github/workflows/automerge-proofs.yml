name: Automerge proofs

# The rung 1 proof that reads the pull request's diff and never executes its code. The job writes
# one `automerge-<name>` artifact (scripts/automerge/proofs/artifact.ts); the risk-review gate reads
# it, binding it to this file, the `pull_request` event, the head SHA and the newest attempt.
# Nothing here posts a check or holds a secret.
#
# The job checks out the judge commit and runs its scripts; the head commit arrives as objects
# only. A job that ran head code could upload an artifact under any name in its run, so the proof
# that judges untrusted dependencies stays in a run where no head code executes. The proofs that
# must build or test head code live in automerge-head-proofs.yml instead.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: automerge-proofs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"

jobs:
  proofs:
    name: Dependency proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      AUTOMERGE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUTOMERGE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      AUTOMERGE_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      AUTOMERGE_HEAD_REF: ${{ github.head_ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # The judge is the base branch's, as this run merges the head onto it: the first parent of the
      # merge commit this workflow file comes from (README.md, "Risk review").
      # `pull_request.base.sha` can be far older. Fetched into a repository of its own.
      - name: Copy the judge
        id: judge
        run: |
          git init -q --bare "$RUNNER_TEMP/judge.git"
          git -C "$RUNNER_TEMP/judge.git" fetch -q --no-tags --depth=2 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          judge=$(git -C "$RUNNER_TEMP/judge.git" rev-parse "$GITHUB_SHA^1")
          git -C "$RUNNER_TEMP/judge.git" archive --output="$RUNNER_TEMP/judge.tar" "$judge" scripts/automerge 'scripts/risk-review*'
          mkdir "$RUNNER_TEMP/judge"
          tar -xf "$RUNNER_TEMP/judge.tar" -C "$RUNNER_TEMP/judge"
          echo "sha=$judge" >> "$GITHUB_OUTPUT"

      # Full history: the proof diffs from the merge base, and the pull request's base can be well
      # behind the judge commit.
      - name: Check out the judge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.judge.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Objects only: nothing from the head is checked out or run.
      - name: Fetch the head commit
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$AUTOMERGE_HEAD_SHA"

      - name: Set up Node.js
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
          run-install: false

      # The producer writes its artifact even when it cannot decide (status `error`), and exits
      # non-zero only when it cannot write one.
      - name: proof-deps
        run: node "$RUNNER_TEMP/judge/scripts/automerge/proofs/deps.ts"

      - name: Upload proof-deps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: automerge-proof-deps
          path: automerge-out/automerge-proof-deps.json
          if-no-files-found: error
