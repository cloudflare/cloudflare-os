<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.75" y="0.75" width="958.5" height="498.5" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="40" y="46" font-size="20" font-weight="600" fill="#334155">Search providers</text>
  <text x="40" y="68" font-size="13" fill="#64748B">Price per 1,000 searches in USD, linear scale, and zero data retention (ZDR) when billed to AI Gateway credits</text>

  <!-- Column headers -->
  <text x="40" y="104" font-size="12" font-weight="600" fill="#64748B">Search provider</text>
  <text x="260" y="104" font-size="12" font-weight="600" fill="#64748B">Price per 1,000 searches</text>
  <text x="752" y="104" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">ZDR</text>
  <text x="860" y="104" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">Status</text>
  <line x1="24" y1="114" x2="936" y2="114" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Default row highlight -->
  <rect x="24" y="120" width="912" height="68" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>

  <!-- Gridlines: $0 to $40, step $10, 9.5px per dollar -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3">
    <line x1="260" y1="120" x2="260" y2="420"/>
    <line x1="355" y1="120" x2="355" y2="420"/>
    <line x1="450" y1="120" x2="450" y2="420"/>
    <line x1="545" y1="120" x2="545" y2="420"/>
    <line x1="640" y1="120" x2="640" y2="420"/>
  </g>

  <!-- Row 1: Ceramic -->
  <text x="40" y="153" font-size="14" font-weight="600" fill="#334155">Ceramic</text>
  <rect x="260" y="137" width="3" height="22" rx="1.5" fill="#16A34A"/>
  <text x="270" y="153" font-size="13" font-weight="600" fill="#15803D">$0.25</text>
  <text x="260" y="177" font-size="12" fill="#64748B">Own 40B+ page index, descriptions up to 8,000 chars</text>
  <rect x="720.75" y="137.75" width="62.5" height="20.5" rx="10.25" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="752" y="152" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">ZDR</text>
  <rect x="800" y="137" width="120" height="22" rx="11" fill="#16A34A"/>
  <text x="860" y="152" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Default</text>

  <line x1="24" y1="196" x2="936" y2="196" stroke="#F1F5F9" stroke-width="1.5"/>

  <!-- Row 2: Linkup -->
  <text x="40" y="229" font-size="14" font-weight="600" fill="#334155">Linkup</text>
  <rect x="260" y="213" width="47.5" height="22" rx="4" fill="#94A3B8"/>
  <text x="316" y="229" font-size="13" font-weight="600" fill="#334155">$5</text>
  <text x="260" y="253" font-size="12" fill="#64748B">Snippets</text>
  <rect x="720.75" y="213.75" width="62.5" height="20.5" rx="10.25" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="752" y="228" font-size="12" font-weight="600" fill="#15803D" text-anchor="middle">ZDR</text>
  <rect x="800.75" y="213.75" width="118.5" height="20.5" rx="10.25" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="860" y="228" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Can be chosen</text>

  <line x1="24" y1="272" x2="936" y2="272" stroke="#F1F5F9" stroke-width="1.5"/>

  <!-- Row 3: Exa -->
  <text x="40" y="305" font-size="14" font-weight="600" fill="#334155">Exa</text>
  <rect x="260" y="289" width="66.5" height="22" rx="4" fill="#FCA5A5"/>
  <text x="335" y="305" font-size="13" font-weight="600" fill="#334155">$7</text>
  <text x="260" y="329" font-size="12" fill="#64748B">Query highlights</text>
  <rect x="720.75" y="289.75" width="62.5" height="20.5" rx="10.25" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="752" y="304" font-size="12" font-weight="600" fill="#B91C1C" text-anchor="middle">No ZDR</text>
  <rect x="800.75" y="289.75" width="118.5" height="20.5" rx="10.25" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="860" y="304" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Can be chosen</text>

  <line x1="24" y1="348" x2="936" y2="348" stroke="#F1F5F9" stroke-width="1.5"/>

  <!-- Row 4: the model's provider, inside the agent's model request. The fee, $10, then the
       results as input tokens: $26 for 1,000 searches on a $2 per million model (the cost table
       in plans/built-in-web-search.md). -->
  <text x="40" y="378" font-size="14" font-weight="600" fill="#334155">The model's provider</text>
  <text x="40" y="396" font-size="12" fill="#64748B">Anthropic or OpenAI</text>
  <rect x="260" y="365" width="95" height="22" rx="4" fill="#FCA5A5"/>
  <rect x="355.75" y="365.75" width="245.5" height="20.5" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="307.5" y="381" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="middle">$10 fee</text>
  <text x="478.5" y="381" font-size="12" font-weight="600" fill="#7F1D1D" text-anchor="middle">about $26 of input, on a $2/M model</text>
  <text x="260" y="405" font-size="12" fill="#64748B">Runs in the agent's model request: recorded after it ran, and its results are billed as input</text>
  <rect x="712.75" y="365.75" width="78.5" height="20.5" rx="10.25" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="752" y="380" font-size="12" font-weight="600" fill="#92400E" text-anchor="middle">Your terms</text>
  <rect x="800.75" y="365.75" width="118.5" height="20.5" rx="10.25" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="860" y="380" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Can be chosen</text>

  <!-- Axis -->
  <line x1="260" y1="420" x2="640" y2="420" stroke="#94A3B8" stroke-width="1.5"/>
  <g font-size="12" fill="#64748B" text-anchor="middle">
    <text x="260" y="438">$0</text>
    <text x="355" y="438">$10</text>
    <text x="450" y="438">$20</text>
    <text x="545" y="438">$30</text>
    <text x="640" y="438">$40</text>
  </g>

  <line x1="24" y1="456" x2="936" y2="456" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="40" y="480" font-size="12" fill="#64748B">Prices: Cloudflare Web Search API docs, October 2026, and Anthropic's and OpenAI's pricing pages, November 2026. Input: measured 2026-11-24.</text>
</svg>
