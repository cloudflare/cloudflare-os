<svg xmlns="http://www.w3.org/2000/svg" width="960" height="812" viewBox="0 0 960 812" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect x="0.75" y="0.75" width="958.5" height="810.5" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="40" y="46" font-size="20" font-weight="600" fill="#334155">How a web search runs</text>
  <text x="40" y="68" font-size="13" fill="#64748B">Two checks and a record before the query leaves the platform</text>

  <!-- Caller -->
  <rect x="80" y="88" width="440" height="48" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <text x="300" y="117" font-size="14" fill="#334155" text-anchor="middle">Agent or gadget calls <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">env.WEB_SEARCH.search(q)</tspan></text>
  <line x1="300" y1="136" x2="300" y2="162" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Check 1: query bound -->
  <rect x="80" y="164" width="440" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="300" y="189" font-size="14" fill="#1E3A8A" text-anchor="middle"><tspan font-weight="600">Gatekeeper</tspan>  <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">search()</tspan></text>
  <text x="300" y="209" font-size="13" fill="#334155" text-anchor="middle">Query not 1 to 1,024 characters?</text>
  <line x1="520" y1="194" x2="578" y2="194" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="549" y="186" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">Yes</text>
  <rect x="580" y="164" width="320" height="60" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="740" y="189" font-size="14" font-weight="600" fill="#DC2626" text-anchor="middle">Refused</text>
  <text x="740" y="209" font-size="13" fill="#334155" text-anchor="middle">Nothing sent, nothing recorded</text>

  <line x1="300" y1="224" x2="300" y2="250" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="242" font-size="12" fill="#64748B">No</text>

  <!-- Check 2: kernel, restricted data -->
  <rect x="80" y="252" width="440" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="300" y="277" font-size="14" fill="#1E3A8A" text-anchor="middle"><tspan font-weight="600">Overseer</tspan>  <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">authorizeObservation()</tspan></text>
  <text x="300" y="297" font-size="13" fill="#334155" text-anchor="middle"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">reachesPublicWeb</tspan>, and the workspace has read restricted data?</text>
  <line x1="520" y1="282" x2="578" y2="282" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="549" y="274" font-size="12" font-weight="600" fill="#DC2626" text-anchor="middle">Yes</text>
  <rect x="580" y="252" width="320" height="60" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="740" y="277" font-size="14" font-weight="600" fill="#DC2626" text-anchor="middle">Refused</text>
  <text x="740" y="297" font-size="13" fill="#334155" text-anchor="middle">Nothing sent, nothing recorded</text>

  <line x1="300" y1="312" x2="300" y2="338" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="330" font-size="12" fill="#64748B">No</text>

  <!-- Record -->
  <rect x="80" y="340" width="440" height="60" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="300" y="365" font-size="14" font-weight="600" fill="#1E3A8A" text-anchor="middle">Recorded</text>
  <text x="300" y="385" font-size="13" fill="#334155" text-anchor="middle">The exact query, in the Activity log</text>

  <!-- Platform boundary -->
  <line x1="40" y1="428" x2="920" y2="428" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="920" y="420" font-size="12" font-style="italic" fill="#64748B" text-anchor="end">Nothing has left the platform above this line</text>

  <line x1="300" y1="400" x2="300" y2="454" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Workers AI binding call -->
  <rect x="80" y="456" width="440" height="64" rx="10" fill="#FFF7ED" stroke="#F6821F" stroke-width="1.5"/>
  <text x="300" y="483" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155" text-anchor="middle">env.AI.websearch({ gatewayId: "default",</text>
  <text x="300" y="503" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155" text-anchor="middle">query, provider: "ceramic", limit: 10 })</text>
  <line x1="300" y1="520" x2="300" y2="542" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AI Gateway -->
  <rect x="80" y="544" width="440" height="56" rx="10" fill="#FFF7ED" stroke="#F6821F" stroke-width="1.5"/>
  <text x="300" y="567" font-size="14" font-weight="600" fill="#C2410C" text-anchor="middle">AI Gateway "default"</text>
  <text x="300" y="587" font-size="13" fill="#334155" text-anchor="middle">The deployment's account: logs the query, bills credits</text>
  <line x1="300" y1="600" x2="300" y2="622" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Ceramic -->
  <rect x="80" y="624" width="440" height="56" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="300" y="647" font-size="14" font-weight="600" fill="#6D28D9" text-anchor="middle">Ceramic.ai</text>
  <text x="300" y="667" font-size="13" fill="#334155" text-anchor="middle">Search index, zero data retention</text>
  <line x1="300" y1="680" x2="300" y2="710" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="700" font-size="12" fill="#64748B">Response</text>

  <!-- Output -->
  <rect x="80" y="712" width="440" height="72" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.5"/>
  <text x="300" y="739" font-size="14" font-weight="600" fill="#15803D" text-anchor="middle">Up to 10 results, parsed with zod</text>
  <text x="300" y="761" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#334155" text-anchor="middle">{ title, url, description?, lastModifiedDate? }</text>
</svg>
