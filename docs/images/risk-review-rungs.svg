<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.75" y="0.75" width="958.5" height="558.5" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

  <text x="40" y="46" font-size="20" font-weight="600" fill="#334155">Where 89 past pull requests would go</text>
  <text x="40" y="68" font-size="13" fill="#64748B">The last 89 pull requests merged on GitHub as of 2026-11-09, rated by the gate's fixed rules,</text>
  <text x="40" y="86" font-size="13" fill="#64748B">each counted once. The five parts add up to all 89.</text>

  <!-- One bar, 880px = 89 PRs -->
  <g font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <rect x="40" y="104" width="89" height="40" fill="#D97706"/>
    <text x="84.5" y="129">9</text>
    <rect x="129" y="104" width="29.7" height="40" fill="#7C3AED"/>
    <text x="143.8" y="129" font-size="12">3</text>
    <rect x="158.7" y="104" width="524" height="40" fill="#93C5FD"/>
    <text x="420.7" y="129" fill="#1E3A8A">53</text>
    <rect x="682.7" y="104" width="49.4" height="40" fill="#2563EB"/>
    <text x="707.4" y="129">5</text>
    <rect x="732.1" y="104" width="187.9" height="40" fill="#94A3B8"/>
    <text x="826" y="129">19</text>
  </g>
  <rect x="40" y="104" width="880" height="40" rx="3" fill="none" stroke="#CBD5E1" stroke-width="1"/>

  <!-- What a rung could take, and what needs a person -->
  <g stroke="#64748B" stroke-width="1.5">
    <line x1="40" y1="152" x2="40" y2="164"/>
    <line x1="158.7" y1="152" x2="158.7" y2="164"/>
    <line x1="40" y1="158" x2="158.7" y2="158"/>
    <line x1="920" y1="152" x2="920" y2="164"/>
    <line x1="158.7" y1="158" x2="920" y2="158" stroke-dasharray="3 3"/>
  </g>
  <text x="40" y="180" font-size="13" fill="#334155">12 (13%) open to a rung</text>
  <text x="539.3" y="180" font-size="13" fill="#334155" text-anchor="middle">77 (87%) a person, or for some of the 53 a maintainer's proof</text>

  <!-- Table -->
  <g font-size="12" font-weight="600" fill="#64748B">
    <text x="40" y="220">Where</text>
    <text x="250" y="220">What decides</text>
    <text x="840" y="220" text-anchor="end">PRs</text>
    <text x="920" y="220" text-anchor="end">Share</text>
  </g>
  <line x1="24" y1="230" x2="936" y2="230" stroke="#E5E7EB" stroke-width="1.5"/>

  <g font-size="13" fill="#334155">
    <rect x="40" y="246" width="12" height="12" rx="2" fill="#D97706"/>
    <text x="60" y="257" font-weight="600">Rung 1 · Proven</text>
    <text x="250" y="257">Dependabot: its dependency proof and preview smoke hold; no AI decides</text>
    <text x="840" y="257" text-anchor="end">9</text>
    <text x="920" y="257" text-anchor="end">10%</text>
    <line x1="24" y1="272" x2="936" y2="272" stroke="#F1F5F9" stroke-width="1.5"/>

    <rect x="40" y="288" width="12" height="12" rx="2" fill="#7C3AED"/>
    <text x="60" y="299" font-weight="600">Rung 2 · AI-scored</text>
    <text x="250" y="299">Low risk, by a maintainer: Bonk and Opus both clear the threshold</text>
    <text x="840" y="299" text-anchor="end">3</text>
    <text x="920" y="299" text-anchor="end">3%</text>
    <line x1="24" y1="314" x2="936" y2="314" stroke="#F1F5F9" stroke-width="1.5"/>

    <rect x="40" y="330" width="12" height="12" rx="2" fill="#93C5FD"/>
    <text x="60" y="341" font-weight="600">Medium or high risk</text>
    <text x="250" y="341">A person, unless a maintainer's test or equivalence proof holds (rung 1)</text>
    <text x="840" y="341" text-anchor="end">53</text>
    <text x="920" y="341" text-anchor="end">60%</text>
    <line x1="24" y1="356" x2="936" y2="356" stroke="#F1F5F9" stroke-width="1.5"/>

    <rect x="40" y="372" width="12" height="12" rx="2" fill="#2563EB"/>
    <text x="60" y="383" font-weight="600">Another author</text>
    <text x="250" y="383">A person: the author is neither a maintainer nor Dependabot</text>
    <text x="840" y="383" text-anchor="end">5</text>
    <text x="920" y="383" text-anchor="end">6%</text>
    <line x1="24" y1="398" x2="936" y2="398" stroke="#F1F5F9" stroke-width="1.5"/>

    <rect x="40" y="414" width="12" height="12" rx="2" fill="#94A3B8"/>
    <text x="60" y="425" font-weight="600">Always a person</text>
    <text x="250" y="425">CI, the gate, auth, release, AGENTS.md, REVIEW.md</text>
    <text x="840" y="425" text-anchor="end">19</text>
    <text x="920" y="425" text-anchor="end">21%</text>
  </g>
  <line x1="24" y1="440" x2="936" y2="440" stroke="#E5E7EB" stroke-width="1.5"/>
  <g font-size="13" font-weight="600" fill="#334155">
    <text x="60" y="462">Total</text>
    <text x="840" y="462" text-anchor="end">89</text>
    <text x="920" y="462" text-anchor="end">100%</text>
  </g>

  <!-- Footer -->
  <rect x="24" y="480" width="912" height="60" rx="8" fill="#F8FAFC" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="40" y="504" font-size="12.5" fill="#334155"><tspan font-weight="600">Both rungs ship switched off, so none of these would merge without a person.</tspan> Counted from paths, size</text>
  <text x="40" y="524" font-size="12.5" fill="#334155">and author alone; no proof or verdict was replayed. Each must also hold, and a maintainer's comment or change request holds a PR.</text>
</svg>
