# Checks against GitHub itself what the GitHub gatekeeper's hooks rely on GitHub for, which the
# fakes in the regular suites can only assume: see packages/gatekeeper-github/__tests__/contract.
#
# It needs a disposable private repository, with at least one commit, named `owner/name` by the
# CONTRACT_GITHUB_REPO variable, and the CONTRACT_GITHUB_TOKEN secret, without which it does
# nothing: a fine-grained token of an account kept for the purpose, which administers the
# repository, with access to that repository alone (administration, contents, issues, pull requests
# and webhooks, read and write) -- not a classic one, whose `repo` scope reaches every repository
# its account can. Only the step running the checks is handed it, not those installing what they
# run. Each run leaves closed issues and pull requests behind.
name: GitHub contract

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Runs share the one repository.
concurrency:
  group: github-contract
  cancel-in-progress: false

env:
  NODE_VERSION: "24.19.0"

jobs:
  contract:
    name: GitHub contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Says whether there is one without handing every step the token, as `if:` can't read secrets.
      - name: Look for a contract repository
        id: contract
        env:
          CONTRACT_GITHUB_TOKEN: ${{ secrets.CONTRACT_GITHUB_TOKEN }}
          CONTRACT_GITHUB_REPO: ${{ vars.CONTRACT_GITHUB_REPO }}
        run: |
          if [ -n "$CONTRACT_GITHUB_TOKEN" ] && [ -n "$CONTRACT_GITHUB_REPO" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CONTRACT_GITHUB_TOKEN or CONTRACT_GITHUB_REPO is not set, so the GitHub contract checks were skipped."
          fi

      - name: Check out repository
        if: steps.contract.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack
        if: steps.contract.outputs.configured == 'true'
        run: corepack enable

      - name: Set up Vite+, Node.js and dependencies
        if: steps.contract.outputs.configured == 'true'
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true
          run-install: true

      - name: Check GitHub's contract
        if: steps.contract.outputs.configured == 'true'
        run: pnpm --filter @gadgets/github-gatekeeper test:contract
        env:
          CONTRACT_GITHUB_TOKEN: ${{ secrets.CONTRACT_GITHUB_TOKEN }}
          CONTRACT_GITHUB_REPO: ${{ vars.CONTRACT_GITHUB_REPO }}
          # This workflow's own token, which can't read the contract repository: the access check's
          # outsider.
          CONTRACT_GITHUB_OUTSIDER_TOKEN: ${{ github.token }}
