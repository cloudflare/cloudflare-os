[package]
name = "odie-os-native"
version = "1.0.2"
description = "Odie OS native shell"
authors = ["Totango"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "odie_os_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-stronghold = "2.3.1"
tauri-plugin-keyring-store = "0.2"
iota_stronghold = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
getrandom = "0.3"
tauri-plugin-notification = "2.4.0"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-biometric = "2.3.2"

[dev-dependencies]
tempfile = "3"

# Stronghold's snapshot KDF is intentionally expensive. Optimizing only its crypto stack keeps
# debug app startup representative without sacrificing debuggability in Odie's own Rust code.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.iota-crypto]
opt-level = 3

[profile.dev.package.iota_stronghold]
opt-level = 3

[profile.dev.package.stronghold_engine]
opt-level = 3
