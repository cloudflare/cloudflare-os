<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; worker-src 'none'; child-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
    <title>Webhooks</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: var(--color-kumo-base, #fcfcfb);
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background: var(--color-kumo-base, #16141d);
        }
      }
    </style>
    <script>
      document.documentElement.dataset.mode = window.matchMedia("(prefers-color-scheme: dark)")
        .matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
